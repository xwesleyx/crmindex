databases:
  - name: integra-crm-db
    plan: free
    postgresMajorVersion: "16"

services:
  # CRM (Next.js)
  - type: web
    name: integra-crm
    runtime: node
    plan: starter # pode trocar pra "free", mas o serviço "dorme" sem uso
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: integra-crm-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: ADMIN_EMAIL
        sync: false # preencher na criação do blueprint
      - key: ADMIN_PASSWORD
        sync: false # preencher na criação do blueprint (mín. 7 caracteres)
      - key: ADMIN_NAME
        value: Administrador
      - key: WHATSAPP_PROVIDER
        value: neonize
      - key: WHATSAPP_SERVICE_URL
        sync: false # preencher DEPOIS: URL pública do serviço integra-crm-whatsapp
      - key: WHATSAPP_SERVICE_SECRET
        sync: false # o MESMO valor do WEBHOOK_SECRET do integra-crm-whatsapp

  # Ponte com o WhatsApp (Python/Neonize) — precisa ficar sempre ligado e
  # com disco persistente, por isso plan "starter" (free não tem disco e
  # dorme com inatividade, o que derrubaria a sessão do WhatsApp).
  - type: web
    name: integra-crm-whatsapp
    runtime: python
    rootDir: whatsapp-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: whatsapp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_NAME
        value: /data/integra-crm.db
      - key: MEDIA_DIR
        value: /data/media
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: NEXTJS_WEBHOOK_URL
        sync: false # preencher DEPOIS: https://<url-do-integra-crm>.onrender.com/api/webhooks/whatsapp
      - key: PUBLIC_URL
        sync: false # preencher DEPOIS: URL pública deste próprio serviço
